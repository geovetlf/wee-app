<!DOCTYPE html>
<!--
  LEGADO — PROPUESTO PARA RETIRAR (docs/LEGADO-HIDETOK.md). Mini-cliente de la época del
  cambio de nombre (db070a9, 2026-04-14), con Firebase JS 11 cargado de gstatic: lee y
  ESCRIBE en `posts` y `comments` de producción fuera de la capa de servicios de la app
  (no pasa por moderación, i18n ni Credit Engine; solo lo frenan las reglas). Nada vivo lo
  enlaza —la landing apunta a wee.zone—, pero se sirve en get-wee.web.app/app.html,
  wee-app.web.app/app.html y www.wee.zone/app.html. No es la app de Weë: la app es wee.zone.
-->
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Weë</title>
  <link rel="icon" type="image/png" href="/img/icon.png">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    :root {
      --bg: #FFFFFF; --surface: #F8F9FA; --card: #FFFFFF;
      --text: #1F2937; --text2: #6B7280; --border: #E5E7EB;
      --gold: #F5B731; --gold-light: #FFF8E7;
      --red: #EF4444; --green: #22C55E;
      --sidebar-w: 260px; --feed-max: 600px;
    }
    body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; background: var(--bg); color: var(--text); }
    a { color: inherit; text-decoration: none; }

    /* LAYOUT */
    .layout { display: flex; min-height: 100vh; max-width: 1100px; margin: 0 auto; }
    .sidebar { width: var(--sidebar-w); position: sticky; top: 0; height: 100vh; padding: 16px; border-right: 1px solid var(--border); display: flex; flex-direction: column; }
    .main { flex: 1; max-width: var(--feed-max); border-right: 1px solid var(--border); min-height: 100vh; }
    .right-panel { width: 280px; padding: 16px; position: sticky; top: 0; height: 100vh; overflow-y: auto; }

    /* SIDEBAR */
    .sidebar-logo { height: 32px; width: auto; object-fit: contain; margin-bottom: 24px; }
    .sidebar-nav { display: flex; flex-direction: column; gap: 4px; flex: 1; }
    .nav-item { display: flex; align-items: center; gap: 12px; padding: 12px 14px; border-radius: 12px; font-size: 15px; font-weight: 500; cursor: pointer; transition: background 0.15s; }
    .nav-item:hover { background: var(--surface); }
    .nav-item.active { font-weight: 700; background: var(--gold-light); color: var(--gold); }
    .nav-item svg { width: 22px; height: 22px; }
    .sidebar-profile { display: flex; align-items: center; gap: 10px; padding: 12px; border-radius: 12px; cursor: pointer; margin-top: auto; }
    .sidebar-profile:hover { background: var(--surface); }
    .avatar { width: 36px; height: 36px; border-radius: 50%; background: var(--gold-light); display: flex; align-items: center; justify-content: center; overflow: hidden; font-size: 16px; font-weight: 700; color: var(--gold); }
    .avatar img { width: 100%; height: 100%; object-fit: cover; }
    .profile-name { font-size: 14px; font-weight: 600; }
    .profile-sub { font-size: 12px; color: var(--text2); }

    /* HEADER */
    .feed-header { padding: 16px; border-bottom: 1px solid var(--border); font-size: 18px; font-weight: 700; position: sticky; top: 0; background: rgba(255,255,255,0.9); backdrop-filter: blur(10px); z-index: 10; }

    /* POST CARD */
    .post { padding: 16px; border-bottom: 1px solid var(--border); }
    .post:hover { background: var(--surface); }
    .post-header { display: flex; align-items: center; gap: 10px; margin-bottom: 10px; }
    .post-avatar { width: 40px; height: 40px; border-radius: 50%; background: var(--gold-light); display: flex; align-items: center; justify-content: center; overflow: hidden; cursor: pointer; }
    .post-avatar img { width: 100%; height: 100%; object-fit: cover; }
    .post-author { font-weight: 600; font-size: 14px; cursor: pointer; }
    .post-author:hover { text-decoration: underline; }
    .post-community { font-size: 12px; color: var(--gold); font-weight: 500; }
    .post-time { font-size: 12px; color: var(--text2); margin-left: auto; }
    .post-content { font-size: 15px; line-height: 1.55; margin-bottom: 10px; white-space: pre-wrap; word-break: break-word; }
    .post-images { display: grid; gap: 4px; border-radius: 12px; overflow: hidden; margin-bottom: 10px; }
    .post-images.single { grid-template-columns: 1fr; }
    .post-images.multi { grid-template-columns: 1fr 1fr; }
    .post-images img { width: 100%; aspect-ratio: 4/3; object-fit: cover; cursor: pointer; }
    .post-actions { display: flex; gap: 0; }
    .action-btn { display: flex; align-items: center; gap: 6px; padding: 6px 12px; border-radius: 100px; font-size: 13px; color: var(--text2); cursor: pointer; border: none; background: none; transition: all 0.15s; flex: 1; justify-content: center; }
    .action-btn:hover { background: var(--surface); }
    .action-btn.agree:hover, .action-btn.agree.active { color: var(--green); background: rgba(34,197,94,0.1); }
    .action-btn.disagree:hover, .action-btn.disagree.active { color: var(--red); background: rgba(239,68,68,0.1); }
    .action-btn.comment:hover { color: var(--gold); background: var(--gold-light); }

    /* RIGHT PANEL */
    .panel-section { margin-bottom: 24px; }
    .panel-title { font-size: 18px; font-weight: 700; margin-bottom: 12px; }
    .community-item { display: flex; align-items: center; gap: 10px; padding: 8px 0; cursor: pointer; }
    .community-item:hover .community-name { text-decoration: underline; }
    .community-icon { width: 36px; height: 36px; border-radius: 10px; display: flex; align-items: center; justify-content: center; font-size: 18px; background: var(--surface); }
    .community-name { font-size: 14px; font-weight: 600; }
    .community-members { font-size: 12px; color: var(--text2); }

    /* LOGIN */
    .login-prompt { text-align: center; padding: 40px 24px; }
    .login-prompt p { color: var(--text2); margin-bottom: 20px; font-size: 15px; }
    .btn-login { display: inline-flex; align-items: center; gap: 8px; background: var(--gold); color: #FFF; padding: 12px 28px; border-radius: 100px; font-size: 15px; font-weight: 700; border: none; cursor: pointer; transition: transform 0.15s; }
    .btn-login:hover { transform: translateY(-1px); }

    /* LOADING */
    .spinner { width: 28px; height: 28px; border: 3px solid var(--border); border-top-color: var(--gold); border-radius: 50%; animation: spin 0.6s linear infinite; margin: 40px auto; }
    @keyframes spin { to { transform: rotate(360deg); } }
    .empty { text-align: center; padding: 60px 24px; color: var(--text2); }
    .empty svg { width: 48px; height: 48px; margin-bottom: 12px; opacity: 0.4; }

    /* COMMENTS MODAL */
    .modal-overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.4); z-index: 100; display: none; align-items: center; justify-content: center; }
    .modal-overlay.open { display: flex; }
    .modal { background: var(--card); border-radius: 16px; width: 500px; max-width: 90vw; max-height: 80vh; display: flex; flex-direction: column; }
    .modal-header { padding: 16px; border-bottom: 1px solid var(--border); font-weight: 700; display: flex; justify-content: space-between; align-items: center; }
    .modal-close { background: none; border: none; font-size: 20px; cursor: pointer; color: var(--text2); padding: 4px 8px; }
    .modal-body { flex: 1; overflow-y: auto; padding: 16px; }
    .modal-footer { padding: 12px 16px; border-top: 1px solid var(--border); display: flex; gap: 8px; }
    .modal-footer input { flex: 1; border: 1px solid var(--border); border-radius: 100px; padding: 10px 16px; font-size: 14px; outline: none; }
    .modal-footer input:focus { border-color: var(--gold); }
    .modal-footer button { background: var(--gold); color: #FFF; border: none; border-radius: 100px; padding: 10px 20px; font-weight: 600; cursor: pointer; font-size: 14px; }
    .comment { padding: 10px 0; border-bottom: 1px solid var(--border); }
    .comment:last-child { border: none; }
    .comment-header { display: flex; align-items: center; gap: 8px; margin-bottom: 4px; }
    .comment-author { font-weight: 600; font-size: 13px; }
    .comment-time { font-size: 11px; color: var(--text2); }
    .comment-text { font-size: 14px; line-height: 1.5; }

    /* IMAGE MODAL */
    .img-modal { position: fixed; inset: 0; background: rgba(0,0,0,0.9); z-index: 200; display: none; align-items: center; justify-content: center; cursor: pointer; }
    .img-modal.open { display: flex; }
    .img-modal img { max-width: 90vw; max-height: 90vh; object-fit: contain; }

    /* RESPONSIVE */
    @media (max-width: 1024px) { .right-panel { display: none; } }
    @media (max-width: 768px) {
      .sidebar { display: none; }
      .main { max-width: 100%; }
    }
  </style>
</head>
<body>

<div class="layout">
  <!-- SIDEBAR -->
  <div class="sidebar">
    <img src="/img/logo.png" alt="Weë" class="sidebar-logo">
    <nav class="sidebar-nav">
      <div class="nav-item active" data-view="home" onclick="navigate('home')">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 9l9-7 9 7v11a2 2 0 01-2 2H5a2 2 0 01-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg>
        Inicio
      </div>
      <div class="nav-item" data-view="communities" onclick="navigate('communities')">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><line x1="2" y1="12" x2="22" y2="12"/><path d="M12 2a15.3 15.3 0 014 10 15.3 15.3 0 01-4 10 15.3 15.3 0 01-4-10 15.3 15.3 0 014-10z"/></svg>
        Comunidades
      </div>
      <div class="nav-item" data-view="weebiz" onclick="navigate('weebiz')">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 3h18v18H3z"/><path d="M3 9h18M9 21V9"/></svg>
        Weë Biz
      </div>
      <div class="nav-item" data-view="profile" onclick="navigate('profile')">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M20 21v-2a4 4 0 00-4-4H8a4 4 0 00-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
        Perfil
      </div>
    </nav>
    <div class="sidebar-profile" id="sidebarProfile" style="display:none;">
      <div class="avatar" id="sidebarAvatar">W</div>
      <div>
        <div class="profile-name" id="sidebarName">Usuario</div>
        <div class="profile-sub" id="sidebarSub">@usuario</div>
      </div>
    </div>
  </div>

  <!-- MAIN FEED -->
  <div class="main">
    <div class="feed-header" id="feedHeader">Inicio</div>
    <div id="feedContent">
      <div class="spinner"></div>
    </div>
  </div>

  <!-- RIGHT PANEL -->
  <div class="right-panel">
    <div class="panel-section" id="loginSection">
      <div class="login-prompt">
        <p>Inicia sesión para interactuar</p>
        <button class="btn-login" onclick="loginWithGoogle()">
          <svg width="18" height="18" viewBox="0 0 24 24"><path d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92a5.06 5.06 0 01-2.2 3.32v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.1z" fill="#4285F4"/><path d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z" fill="#34A853"/><path d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z" fill="#FBBC05"/><path d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z" fill="#EA4335"/></svg>
          Iniciar con Google
        </button>
      </div>
    </div>
    <div class="panel-section">
      <div class="panel-title">Comunidades</div>
      <div id="communitiesList"><div class="spinner"></div></div>
    </div>
  </div>
</div>

<!-- COMMENTS MODAL -->
<div class="modal-overlay" id="commentsModal">
  <div class="modal">
    <div class="modal-header">
      Comentarios
      <button class="modal-close" onclick="closeComments()">&times;</button>
    </div>
    <div class="modal-body" id="commentsList"></div>
    <div class="modal-footer" id="commentFooter" style="display:none;">
      <input type="text" id="commentInput" placeholder="Escribe un comentario..." onkeydown="if(event.key==='Enter')submitComment()">
      <button onclick="submitComment()">Enviar</button>
    </div>
  </div>
</div>

<!-- IMAGE MODAL -->
<div class="img-modal" id="imgModal" onclick="this.classList.remove('open')">
  <img id="imgModalSrc">
</div>

<!-- FIREBASE SDK -->
<script type="module">
import { initializeApp } from 'https://www.gstatic.com/firebasejs/11.0.1/firebase-app.js';
import { getAuth, signInWithPopup, GoogleAuthProvider, onAuthStateChanged, signOut } from 'https://www.gstatic.com/firebasejs/11.0.1/firebase-auth.js';
import { getFirestore, collection, query, where, orderBy, limit, getDocs, getDoc, doc, addDoc, updateDoc, increment, Timestamp, startAfter } from 'https://www.gstatic.com/firebasejs/11.0.1/firebase-firestore.js';

const firebaseConfig = {
  apiKey: 'AIzaSyAZ_6Lvm-pZ_FchdzkRTI48aYixI10D92A',
  authDomain: 'get-wee.firebaseapp.com',
  projectId: 'get-wee',
  storageBucket: 'get-wee.firebasestorage.app',
  messagingSenderId: '546769059837',
  appId: '1:546769059837:web:49e597a11886449ea4a394',
};

const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
const db = getFirestore(app);

let currentUser = null;
let currentView = 'home';
let currentPostForComments = null;
const userCache = {};

// --- AUTH ---
window.loginWithGoogle = async () => {
  try {
    await signInWithPopup(auth, new GoogleAuthProvider());
  } catch (e) { console.error('Login error:', e); }
};

window.logoutUser = async () => {
  await signOut(auth);
  location.reload();
};

onAuthStateChanged(auth, (user) => {
  currentUser = user;
  const loginSec = document.getElementById('loginSection');
  const sidebarProf = document.getElementById('sidebarProfile');
  if (user) {
    loginSec.style.display = 'none';
    sidebarProf.style.display = 'flex';
    document.getElementById('sidebarName').textContent = user.displayName || 'Usuario';
    document.getElementById('sidebarSub').textContent = user.email;
    if (user.photoURL) {
      document.getElementById('sidebarAvatar').innerHTML = `<img src="${user.photoURL}">`;
    }
    document.getElementById('commentFooter').style.display = 'flex';
  } else {
    loginSec.style.display = 'block';
    sidebarProf.style.display = 'none';
    document.getElementById('commentFooter').style.display = 'none';
  }
});

// --- USER CACHE ---
async function getUser(uid) {
  if (userCache[uid]) return userCache[uid];
  const q2 = query(collection(db, 'users'), where('uid', '==', uid), limit(1));
  const snap = await getDocs(q2);
  if (!snap.empty) { userCache[uid] = snap.docs[0].data(); return userCache[uid]; }
  return { displayName: 'Usuario', avatarType: 'predefined' };
}

function avatarHtml(user, size = 40) {
  if (user.photoURL) return `<img src="${user.photoURL}" style="width:${size}px;height:${size}px;border-radius:50%;object-fit:cover;">`;
  const letter = (user.displayName || 'U')[0].toUpperCase();
  return `<div style="width:${size}px;height:${size}px;border-radius:50%;background:var(--gold-light);display:flex;align-items:center;justify-content:center;font-weight:700;color:var(--gold);font-size:${size*0.45}px;">${letter}</div>`;
}

// --- TIME ---
function timeAgo(ts) {
  if (!ts) return '';
  const d = ts.toDate ? ts.toDate() : new Date(ts);
  const s = Math.floor((Date.now() - d) / 1000);
  if (s < 60) return 'ahora';
  if (s < 3600) return Math.floor(s/60) + 'm';
  if (s < 86400) return Math.floor(s/3600) + 'h';
  if (s < 604800) return Math.floor(s/86400) + 'd';
  return d.toLocaleDateString('es-ES', { day: 'numeric', month: 'short' });
}

// --- NAVIGATE ---
window.navigate = (view) => {
  currentView = view;
  document.querySelectorAll('.nav-item').forEach(n => n.classList.remove('active'));
  document.querySelector(`[data-view="${view}"]`)?.classList.add('active');
  const header = document.getElementById('feedHeader');
  const content = document.getElementById('feedContent');
  content.innerHTML = '<div class="spinner"></div>';

  if (view === 'home') { header.textContent = 'Inicio'; loadPosts(); }
  else if (view === 'communities') { header.textContent = 'Comunidades'; loadCommunitiesView(); }
  else if (view === 'weebiz') { header.textContent = 'Weë Biz'; loadWeeBiz(); }
  else if (view === 'profile') { header.textContent = 'Perfil'; loadProfile(); }
};

// --- POSTS ---
async function loadPosts(communityId = null) {
  const content = document.getElementById('feedContent');
  try {
    let q2;
    if (communityId) {
      q2 = query(collection(db, 'posts'), where('communityId', '==', communityId), orderBy('createdAt', 'desc'), limit(30));
    } else {
      q2 = query(collection(db, 'posts'), orderBy('createdAt', 'desc'), limit(30));
    }
    const snap = await getDocs(q2);
    if (snap.empty) { content.innerHTML = '<div class="empty"><p>No hay posts aún</p></div>'; return; }

    let html = '';
    for (const d of snap.docs) {
      const p = { id: d.id, ...d.data() };
      const user = await getUser(p.userId);
      html += renderPost(p, user);
    }
    content.innerHTML = html;
  } catch (e) { console.error(e); content.innerHTML = '<div class="empty"><p>Error cargando posts</p></div>'; }
}

function renderPost(p, user) {
  let imagesHtml = '';
  if (p.imageUrls && p.imageUrls.length > 0) {
    const cls = p.imageUrls.length === 1 ? 'single' : 'multi';
    imagesHtml = `<div class="post-images ${cls}">${p.imageUrls.slice(0,4).map(u => `<img src="${u}" onclick="openImg('${u}')" loading="lazy">`).join('')}</div>`;
  }

  const agree = p.agreementCount || 0;
  const disagree = p.disagreementCount || 0;
  const comments = p.comments || 0;

  return `<div class="post">
    <div class="post-header">
      <div class="post-avatar">${avatarHtml(user, 40)}</div>
      <div>
        <div class="post-author">${user.displayName || 'Usuario'}</div>
        ${p.communitySlug ? `<div class="post-community">${p.communitySlug}</div>` : ''}
      </div>
      <div class="post-time">${timeAgo(p.createdAt)}</div>
    </div>
    ${p.content ? `<div class="post-content">${escapeHtml(p.content)}</div>` : ''}
    ${imagesHtml}
    <div class="post-actions">
      <button class="action-btn agree" onclick="vote('${p.id}','agree')">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M14 9V5a3 3 0 00-3-3l-4 9v11h11.28a2 2 0 002-1.7l1.38-9a2 2 0 00-2-2.3H14z"/></svg>
        ${agree}
      </button>
      <button class="action-btn disagree" onclick="vote('${p.id}','disagree')">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M10 15V19a3 3 0 003 3l4-9V2H5.72a2 2 0 00-2 1.7l-1.38 9a2 2 0 002 2.3H10z"/></svg>
        ${disagree}
      </button>
      <button class="action-btn comment" onclick="openComments('${p.id}')">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 15a2 2 0 01-2 2H7l-4 4V5a2 2 0 012-2h14a2 2 0 012 2z"/></svg>
        ${comments}
      </button>
    </div>
  </div>`;
}

function escapeHtml(t) {
  const d = document.createElement('div');
  d.textContent = t;
  return d.innerHTML;
}

// --- VOTE ---
window.vote = async (postId, type) => {
  if (!currentUser) return alert('Inicia sesión para votar');
  // Simple increment - in production you'd check for duplicate votes
  try {
    const field = type === 'agree' ? 'agreementCount' : 'disagreementCount';
    await updateDoc(doc(db, 'posts', postId), { [field]: increment(1) });
    navigate(currentView);
  } catch (e) { console.error(e); }
};

// --- COMMENTS ---
window.openComments = async (postId) => {
  currentPostForComments = postId;
  document.getElementById('commentsModal').classList.add('open');
  const list = document.getElementById('commentsList');
  list.innerHTML = '<div class="spinner"></div>';

  try {
    const q2 = query(collection(db, 'comments'), where('postId', '==', postId), orderBy('createdAt', 'asc'));
    const snap = await getDocs(q2);
    if (snap.empty) { list.innerHTML = '<div class="empty"><p>Sin comentarios aún</p></div>'; return; }

    let html = '';
    for (const d of snap.docs) {
      const c = d.data();
      const user = await getUser(c.userId);
      html += `<div class="comment">
        <div class="comment-header">
          ${avatarHtml(user, 28)}
          <span class="comment-author">${user.displayName || 'Usuario'}</span>
          <span class="comment-time">${timeAgo(c.createdAt)}</span>
        </div>
        <div class="comment-text">${escapeHtml(c.content || c.text || '')}</div>
      </div>`;
    }
    list.innerHTML = html;
  } catch (e) { console.error(e); list.innerHTML = '<div class="empty"><p>Error</p></div>'; }
};

window.closeComments = () => {
  document.getElementById('commentsModal').classList.remove('open');
  currentPostForComments = null;
};

window.submitComment = async () => {
  if (!currentUser || !currentPostForComments) return;
  const input = document.getElementById('commentInput');
  const text = input.value.trim();
  if (!text) return;

  try {
    await addDoc(collection(db, 'comments'), {
      postId: currentPostForComments,
      userId: currentUser.uid,
      content: text,
      likes: 0,
      agreementCount: 0,
      disagreementCount: 0,
      createdAt: Timestamp.now(),
    });
    await updateDoc(doc(db, 'posts', currentPostForComments), { comments: increment(1) });
    input.value = '';
    openComments(currentPostForComments);
  } catch (e) { console.error(e); alert('Error enviando comentario'); }
};

// --- IMAGE MODAL ---
window.openImg = (url) => {
  document.getElementById('imgModalSrc').src = url;
  document.getElementById('imgModal').classList.add('open');
};

// --- COMMUNITIES ---
async function loadCommunitiesSidebar() {
  try {
    const q2 = query(collection(db, 'communities'), where('status', '==', 'active'), orderBy('memberCount', 'desc'), limit(8));
    const snap = await getDocs(q2);
    const el = document.getElementById('communitiesList');
    if (snap.empty) { el.innerHTML = '<p style="color:var(--text2);font-size:13px;">Sin comunidades</p>'; return; }

    el.innerHTML = snap.docs.map(d => {
      const c = d.data();
      const letter = (c.name || 'C')[0].toUpperCase();
      const img = c.imageUrl ? `<img src="${c.imageUrl}" style="width:36px;height:36px;border-radius:10px;object-fit:cover;">` : `<div style="width:36px;height:36px;border-radius:10px;background:var(--gold-light);display:flex;align-items:center;justify-content:center;font-weight:700;color:var(--gold);">${letter}</div>`;
      return `<div class="community-item" onclick="loadCommunityPosts('${d.id}','${escapeHtml(c.name)}')">
        ${img}
        <div><div class="community-name">${escapeHtml(c.name)}</div><div class="community-members">${c.memberCount || 0} miembros</div></div>
      </div>`;
    }).join('');
  } catch (e) { console.error(e); }
}

async function loadCommunitiesView() {
  const content = document.getElementById('feedContent');
  try {
    const q2 = query(collection(db, 'communities'), where('status', '==', 'active'), orderBy('memberCount', 'desc'), limit(30));
    const snap = await getDocs(q2);
    if (snap.empty) { content.innerHTML = '<div class="empty"><p>Sin comunidades</p></div>'; return; }

    content.innerHTML = snap.docs.map(d => {
      const c = d.data();
      return `<div class="post" style="cursor:pointer;" onclick="loadCommunityPosts('${d.id}','${c.name}')">
        <div class="post-header">
          <div class="post-avatar" style="border-radius:10px;background:var(--gold-light);font-size:20px;">${c.name[0]}</div>
          <div>
            <div class="post-author">${c.name}</div>
            <div style="font-size:12px;color:var(--text2);">${c.memberCount || 0} miembros · ${c.postCount || 0} posts</div>
          </div>
        </div>
        <div class="post-content" style="font-size:14px;color:var(--text2);">${c.description || ''}</div>
      </div>`;
    }).join('');
  } catch (e) { console.error(e); content.innerHTML = '<div class="empty"><p>Error</p></div>'; }
}

window.loadCommunityPosts = (communityId, name) => {
  document.getElementById('feedHeader').textContent = name;
  document.getElementById('feedContent').innerHTML = '<div class="spinner"></div>';
  loadPosts(communityId);
};

// --- WEEBIZ ---
async function loadWeeBiz() {
  const content = document.getElementById('feedContent');
  try {
    const q2 = query(collection(db, 'businesses'), where('status', '==', 'active'), orderBy('createdAt', 'desc'), limit(20));
    const snap = await getDocs(q2);
    if (snap.empty) { content.innerHTML = '<div class="empty"><p>Sin negocios aún</p></div>'; return; }

    content.innerHTML = snap.docs.map(d => {
      const b = d.data();
      const logoHtml = b.logo ? `<img src="${b.logo}" style="width:48px;height:48px;border-radius:12px;object-fit:cover;">` : `<div style="width:48px;height:48px;border-radius:12px;background:var(--surface);display:flex;align-items:center;justify-content:center;font-size:22px;">&#127970;</div>`;
      return `<div class="post">
        <div class="post-header">
          <div>${logoHtml}</div>
          <div>
            <div class="post-author">${b.name}</div>
            <div style="font-size:12px;color:var(--text2);">${b.subcategory || ''} · ${b.location || ''}</div>
          </div>
          ${b.auraScore > 0 ? `<div class="post-time" style="color:var(--gold);font-weight:600;">&#9733; ${b.auraScore.toFixed(1)}</div>` : ''}
        </div>
        ${b.description ? `<div class="post-content" style="font-size:14px;color:var(--text2);">${escapeHtml(b.description)}</div>` : ''}
      </div>`;
    }).join('');
  } catch (e) { console.error(e); content.innerHTML = '<div class="empty"><p>Error</p></div>'; }
}

// --- PROFILE ---
async function loadProfile() {
  const content = document.getElementById('feedContent');
  if (!currentUser) {
    content.innerHTML = `<div class="login-prompt" style="padding:60px 24px;">
      <p>Inicia sesión para ver tu perfil</p>
      <button class="btn-login" onclick="loginWithGoogle()">
        Iniciar con Google
      </button>
    </div>`;
    return;
  }

  try {
    const user = await getUser(currentUser.uid);
    const postsQ = query(collection(db, 'posts'), where('userId', '==', currentUser.uid), orderBy('createdAt', 'desc'), limit(20));
    const postsSnap = await getDocs(postsQ);

    let html = `<div style="padding:24px;text-align:center;border-bottom:1px solid var(--border);">
      <div style="margin:0 auto 12px;">${avatarHtml(user, 72)}</div>
      <div style="font-size:20px;font-weight:700;">${user.displayName || 'Usuario'}</div>
      <div style="font-size:14px;color:var(--text2);margin:4px 0 12px;">${user.bio || ''}</div>
      <div style="display:flex;gap:24px;justify-content:center;font-size:14px;">
        <div><strong>${user.followers || 0}</strong> <span style="color:var(--text2);">seguidores</span></div>
        <div><strong>${user.following || 0}</strong> <span style="color:var(--text2);">siguiendo</span></div>
        <div><strong>${user.posts || 0}</strong> <span style="color:var(--text2);">posts</span></div>
      </div>
      <button onclick="logoutUser()" style="margin-top:16px;padding:8px 20px;border-radius:100px;border:1px solid var(--border);background:none;cursor:pointer;font-size:13px;color:var(--text2);">Cerrar sesión</button>
    </div>`;

    if (postsSnap.empty) {
      html += '<div class="empty"><p>Sin posts aún</p></div>';
    } else {
      for (const d of postsSnap.docs) {
        html += renderPost({ id: d.id, ...d.data() }, user);
      }
    }
    content.innerHTML = html;
  } catch (e) { console.error(e); content.innerHTML = '<div class="empty"><p>Error</p></div>'; }
}

// --- INIT ---
loadPosts();
loadCommunitiesSidebar();
